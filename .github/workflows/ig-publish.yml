# 每天（POST_INTERVAL_DAYS = 1）的美東時間 19:00 發一篇。發文時間的判斷在
# scripts/publish_ig.py 裡（用 America/New_York 時區，會自動處理夏令/冬令時間），
# 這裡只負責叫它起來。
name: IG auto publish

on:
  schedule:
    # 每小時檢查一次（避開整點尖峰，排在每小時 17 分）。GitHub 排程常延遲好幾個小時
    # （2026-11 實測 19:00 的排程被拖到 23:30～02:40 才跑），只排一兩次會讓發文時間很不準。
    # 什麼時候該發由 publish_ig.py 判斷（美東 19:00 之後、今天還沒發才發），所以多跑不會重複發。
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: "只檢查設定是否正常，不發文"
        type: boolean
        default: true
      force:
        description: "忽略發文間隔，立刻發下一篇"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ig-publish # 同時只跑一個，避免同一張被發兩次
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # publish_ig.py 用 zoneinfo 算美東時間，需要 IANA 時區資料。2026-10-19 runner 換成
      # Ubuntu 26 當天發文就失敗，不能假設系統一定有附，自己裝 tzdata 套件比較保險
      - name: Install time zone data
        run: python -m pip install --quiet tzdata

      - name: Check setup only (no posting)
        if: inputs.check_only
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
        run: python scripts/publish_ig.py check

      - name: Publish next post if due
        if: ${{ !inputs.check_only }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
          POST_INTERVAL_DAYS: ${{ vars.POST_INTERVAL_DAYS || '1' }}
        run: python scripts/publish_ig.py publish ${{ inputs.force && '--force' || '' }}

      # 把發文紀錄寫回 repo，下次才知道發到哪、上次是哪天；這個 commit 也讓 repo 保持活躍，
      # 避免 GitHub 對 60 天沒動靜的 repo 自動停用排程
      - name: Save publish state
        run: |
          if ! git diff --quiet -- output/publish_state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898314+github-actions[bot]@users.noreply.github.com"
            git add output/publish_state.json
            git commit -m "Record IG post"
            git push
          fi
