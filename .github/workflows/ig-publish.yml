# 每 3 天（POST_INTERVAL_DAYS）的美東時間 19:00 發一篇。發文時間的判斷在
# scripts/publish_ig.py 裡（用 America/New_York 時區，會自動處理夏令/冬令時間），
# 這裡只負責叫它起來。
name: IG auto publish

on:
  schedule:
    # GitHub cron 只能寫 UTC：夏令時間（EDT）的 19:00 = UTC 23:00，冬令時間（EST）的 19:00
    # = UTC 00:00。兩個都排，腳本會自己判斷當地時間到 19:00 沒、這天該不該發，不會重複發。
    # GitHub 排程常延遲幾分鐘到幾十分鐘。
    - cron: "0 23 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: "只檢查設定是否正常，不發文"
        type: boolean
        default: true
      force:
        description: "忽略發文間隔，立刻發下一篇"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ig-publish # 同時只跑一個，避免同一張被發兩次
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check setup only (no posting)
        if: inputs.check_only
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
        run: python scripts/publish_ig.py check

      - name: Publish next post if due
        if: ${{ !inputs.check_only }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
          POST_INTERVAL_DAYS: ${{ vars.POST_INTERVAL_DAYS || '3' }}
        run: python scripts/publish_ig.py publish ${{ inputs.force && '--force' || '' }}

      # 把發文紀錄寫回 repo，下次才知道發到哪、上次是哪天；這個 commit 也讓 repo 保持活躍，
      # 避免 GitHub 對 60 天沒動靜的 repo 自動停用排程
      - name: Save publish state
        run: |
          if ! git diff --quiet -- output/publish_state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898314+github-actions[bot]@users.noreply.github.com"
            git add output/publish_state.json
            git commit -m "Record IG post"
            git push
          fi
